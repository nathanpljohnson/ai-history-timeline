<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="The history of AI as technology history: lanes, eras, lineage, context and coverage, generated from an Obsidian research vault.">
    <title>AI History Timeline</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23211d18'/%3E%3Cpath d='M10 34h44' stroke='%23e8d8b8' stroke-width='4'/%3E%3Ccircle cx='18' cy='34' r='6' fill='%23b6533f'/%3E%3Ccircle cx='33' cy='34' r='6' fill='%232f7f8f'/%3E%3Ccircle cx='48' cy='34' r='6' fill='%23bc8a2d'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css?v=atlas-22">
  </head>
  <body data-mode="explore">
    <a class="skip-link" href="#viewport">Skip to timeline</a>

    <header class="masthead">
      <div class="mast-title">
        <h1>AI, Told as Technology History</h1>
        <span id="mastCount" class="mast-count"></span>
      </div>
      <nav id="modeTabs" class="mode-tabs" role="tablist" aria-label="Mode">
        <button type="button" role="tab" data-mode="explore" aria-selected="true">Explore</button>
        <button type="button" role="tab" data-mode="read" aria-selected="false">Read</button>
        <button type="button" role="tab" data-mode="analyze" aria-selected="false">Analyze</button>
        <a class="mode-link" href="practice.html">Practice</a>
      </nav>
      <div class="mast-tools">
        <label class="search">
          <span class="sr-only">Search events</span>
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="M10.5 10.5 14 14"/></svg>
          <input id="search" type="search" placeholder="Search" autocomplete="off">
          <kbd>/</kbd>
        </label>
        <button id="filtersBtn" class="tool-btn" type="button" aria-controls="filtersPop" aria-expanded="false">Filters <b></b></button>
        <button id="menuBtn" class="tool-btn icon" type="button" aria-controls="menuPop" aria-expanded="false" aria-label="View settings and references">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="13" cy="8" r="1.4"/></svg>
        </button>
      </div>

      <div id="filtersPop" class="popover filters-pop" hidden>
        <h2>Filters</h2>
        <div class="pop-group">
          <span class="pop-label">Lanes</span>
          <div id="laneFilters" class="lane-filters"></div>
        </div>
        <label class="pop-field"><span class="pop-label">Concept lens</span><select id="lensSelect"></select></label>
        <label class="pop-field"><span class="pop-label">Analytic lens</span>
          <select id="analysisLens">
            <option value="">None</option>
            <option value="decision">Decision makers</option>
            <option value="power">Power / institution</option>
            <option value="material">Material infrastructure</option>
            <option value="closure">Closure devices</option>
            <option value="governance">Governance</option>
            <option value="controversy">Controversies</option>
          </select>
        </label>
        <label id="weekField" class="pop-field"><span class="pop-label">Course week</span><select id="weekSelect"></select></label>
        <label class="pop-check"><input id="landmarksOnly" type="checkbox"> Landmarks only</label>
        <label class="pop-check"><input id="newOnly" type="checkbox"> New since last sync</label>
        <button id="resetFilters" class="pop-reset" type="button">Reset everything</button>
      </div>

      <div id="menuPop" class="popover menu-pop" hidden>
        <div class="pop-group">
          <span class="pop-label">Time scale</span>
          <div class="seg">
            <button type="button" data-scale-set="activity" aria-pressed="true">By activity</button>
            <button type="button" data-scale-set="even" aria-pressed="false">Even years</button>
          </div>
        </div>
        <div class="pop-group">
          <span class="pop-label">Theme</span>
          <div class="seg">
            <button type="button" data-theme-set="auto">Auto</button>
            <button type="button" data-theme-set="light">Light</button>
            <button type="button" data-theme-set="dark">Dark</button>
          </div>
        </div>
        <div class="pop-group">
          <span class="pop-label">Context strips</span>
          <div id="stripToggles" class="strip-toggles"></div>
        </div>
        <div class="pop-group refs">
          <button type="button" data-ref="guide">How to read this</button>
          <button type="button" data-ref="glossary">Glossary</button>
          <button type="button" data-ref="bibliography">Bibliography</button>
          <button type="button" data-ref="list">List view</button>
          <button type="button" data-ref="print">Print</button>
        </div>
        <details class="sync">
          <summary>Vault sync · <span id="syncTime">loading</span></summary>
          <p>Edit notes in the Obsidian vault, run <code>npm run update</code> in the site folder, then refresh. <code>npm run context</code> refreshes the Epoch compute data.</p>
        </details>
      </div>
    </header>

    <main id="stage" class="stage">
      <aside id="tourPanel" class="tour-panel" hidden aria-label="Guided tour"></aside>
      <div class="stage-main">
        <section id="chart" class="chart" aria-label="AI history timeline">
          <div id="toolbar" class="toolbar">
            <div class="tb-where">
              <span id="eraNow" class="era-now"></span>
              <span id="rangeNow" class="range-now"></span>
              <span id="countNow" class="count-now"></span>
            </div>
            <div id="activeChips" class="active-chips"></div>
            <div id="analyzeTools" class="analyze-tools" hidden>
              <label><span class="sr-only">Rhymes</span><select id="rhymeSelect"></select></label>
              <button id="coverageBtn" type="button" class="tb-btn">Coverage report</button>
            </div>
            <div class="tb-zoom">
              <button id="scaleBtn" type="button" class="tb-btn scale-btn" title="Switch between activity-weighted and even time scale">Scaled by activity</button>
              <button id="sliceBtn" type="button" class="tb-btn" aria-pressed="false" title="Cross-section (S)">Slice</button>
              <button id="zoomOut" type="button" class="tb-btn icon" aria-label="Zoom out">−</button>
              <input id="zoomRange" type="range" min="0" max="1000" value="0" aria-label="Zoom">
              <button id="zoomIn" type="button" class="tb-btn icon" aria-label="Zoom in">+</button>
              <button id="fitBtn" type="button" class="tb-btn">Fit</button>
            </div>
          </div>
          <div class="chart-body">
            <div id="viewport" class="viewport" tabindex="0" aria-label="Scrollable, zoomable timeline">
              <div id="head" class="head">
                <div id="eraLabels" class="era-labels"></div>
                <div id="axisLayer" class="axis-layer" title="Click a year for a cross-section"></div>
              </div>
              <div id="canvas" class="canvas">
                <div id="eraLayer" class="era-layer"></div>
                <div id="gridLayer" class="grid-layer"></div>
                <div id="laneLayer" class="lane-layer"></div>
                <div id="stripLayer" class="strip-layer"></div>
                <div id="sliceLayer" class="slice-layer"></div>
                <svg id="lineageLayer" class="lineage-layer" aria-hidden="true"></svg>
                <div id="cardLayer" class="card-layer"></div>
              </div>
            </div>
            <div id="gutter" class="gutter"><div id="gutterHead" class="gutter-head"></div><div id="gutterInner" class="gutter-inner"></div></div>
          </div>
          <div id="overview" class="overview" aria-label="Overview: drag to move">
            <div id="overviewEras" class="ov-eras"></div>
            <div id="overviewRug" class="ov-rug"></div>
            <div id="overviewWindow" class="ov-window"></div>
          </div>
          <section id="listView" class="list-view" hidden aria-label="List view"></section>
        </section>
        <section id="drawer" class="drawer" hidden aria-label="Details"></section>
      </div>
    </main>

    <div id="hover" class="hover" hidden role="tooltip"></div>
    <script type="module" src="app.js?v=atlas-21"></script>
  </body>
</html>
