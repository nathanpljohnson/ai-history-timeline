<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="An updateable AI history timeline generated from an Obsidian vault.">
    <title>AI History Timeline</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23211d18'/%3E%3Cpath d='M10 34h44' stroke='%23e8d8b8' stroke-width='4'/%3E%3Ccircle cx='18' cy='34' r='6' fill='%23b6533f'/%3E%3Ccircle cx='33' cy='34' r='6' fill='%232f7f8f'/%3E%3Ccircle cx='48' cy='34' r='6' fill='%23bc8a2d'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <a class="skip-link" href="#timeline">Skip to timeline</a>
    <header class="topbar">
      <div class="brand">
        <h1>AI, Told as Technology History</h1>
        <details class="sync">
          <summary>Vault sync <strong id="syncTime">Loading data</strong></summary>
          <ol>
            <li>Add or edit notes in the Obsidian vault.</li>
            <li>Run <code>npm run update</code> inside this site folder.</li>
            <li>Refresh the page.</li>
          </ol>
        </details>
      </div>
      <div class="controls" aria-label="Timeline controls">
        <label class="search-box">
          <span class="sr-only">Search notes, concepts, events</span>
          <input id="searchInput" type="search" placeholder="Search: ChatGPT, closure, ImageNet…">
        </label>
        <div id="typeFilters" class="chip-row" role="group" aria-label="Event type"></div>
        <div class="zoom-controls" role="group" aria-label="Timeline zoom controls">
          <button class="chip icon-chip" id="zoomOut" type="button" aria-label="Zoom out">−</button>
          <label class="zoom-slider">
            <span class="sr-only">Zoom level</span>
            <input id="zoomRange" type="range" min="0" max="1000" step="1" value="0">
          </label>
          <button class="chip icon-chip" id="zoomIn" type="button" aria-label="Zoom in">+</button>
          <button class="chip" id="fitTimeline" type="button">Fit</button>
        </div>
      </div>
    </header>

    <main id="timeline" class="timeline-shell" aria-label="AI history timeline">
      <div class="timeline-toolbar">
        <span><strong id="zoomReadout">Decades</strong> · <span id="visibleRange">-</span></span>
        <span><span id="eventCount">0</span> events · <span id="yearRange">-</span></span>
        <label class="lens">
          <span class="sr-only">Concept lens</span>
          <select id="lensSelect"><option value="">No concept lens</option></select>
        </label>
        <label class="lens">
          <span class="sr-only">Course week</span>
          <select id="weekSelect" hidden><option value="">All weeks</option></select>
        </label>
        <button class="chip is-active" id="linksToggle" type="button" aria-pressed="true">Connections</button>
        <span class="hint">Drag or scroll to move · pinch to zoom</span>
      </div>
      <div id="timelineViewport" class="timeline-viewport" tabindex="0" aria-label="Scrollable zoomable timeline">
        <div id="timelineCanvas" class="timeline-canvas">
          <div id="tickLayer" class="tick-layer" aria-hidden="true"></div>
          <svg id="arcLayer" class="arc-layer" aria-hidden="true"></svg>
          <div class="timeline-axis" aria-hidden="true"></div>
          <div id="spanLayer" aria-hidden="true"></div>
          <div id="cardLayer"></div>
          <svg id="focusArcLayer" class="arc-layer focus-layer" aria-hidden="true"></svg>
        </div>
      </div>
      <article id="eventDetail" class="detail-panel" hidden></article>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
